services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17
    container_name: rag-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${RAG_POSTGRES_USER}
      POSTGRES_PASSWORD: ${RAG_POSTGRES_PASSWORD}
      POSTGRES_DB: ${RAG_POSTGRES_DB}

    volumes:
      - /opt/postgres/data:/var/lib/postgresql/data

    # No host port is published.
    # PostgreSQL is reached by other containers through the
    # shared Docker network.
    networks:
      - n8n-network

networks:
  n8n-network:
    external: true
    name: n8n-shared-network